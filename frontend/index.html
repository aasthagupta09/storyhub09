<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2>📖 StoryHub</h2>
    <nav>
        <a href="#home">Home</a>
        <a href="#stories">Stories</a>
        <a href="#write">Write</a>
        <a href="#favourites">❤️ Favourites</a>
    </nav>
</header>

<section id="home" class="hero">
    <h1>Welcome to StoryHub</h1>
    <p>Read, write and share amazing stories.</p>
    <a href="#stories" class="btn">Explore Stories</a>
</section>

<section id="stories" class="section">
    <h2>Discover Stories</h2>
    <div class="tools">
        <input id="search" type="text" placeholder="🔍 Search stories...">
        <select id="category">
            <option value="All">All Categories</option>
            <option>Romance</option><option>Mystery</option><option>Horror</option>
            <option>Adventure</option><option>Fantasy</option><option>Comedy</option>
        </select>
    </div>
    <div id="storyList" class="story-grid"></div>
</section>

<section id="write" class="section">
    <h2>✍️ Write & Publish Your Story</h2>
    <form id="storyForm">
        <input id="title" type="text" placeholder="Story title" required>
        <input id="author" type="text" placeholder="Author name" required>
        <select id="storyCategory" required>
            <option value="">Choose category</option>
            <option>Romance</option><option>Mystery</option><option>Horror</option>
            <option>Adventure</option><option>Fantasy</option><option>Comedy</option>
        </select>
        <textarea id="content" rows="8" placeholder="Write your story here..." required></textarea>
        <button class="btn" type="submit">Publish Story 🚀</button>
    </form>
</section>

<section id="favourites" class="section">
    <h2>❤️ My Favourite Stories</h2>
    <div id="favouriteList" class="story-grid"></div>
</section>

<div id="reader" class="reader hidden">
    <div class="reader-box">
        <button onclick="closeReader()" class="close">✕</button>
        <h2 id="readerTitle"></h2>
        <p id="readerAuthor"></p>
        <p id="readerCategory"></p>
        <hr>
        <p id="readerContent"></p>
        <h3>Give Rating</h3>
        <div id="ratingButtons"></div>
    </div>
</div>

<footer>© 2026 StoryHub | Java Mini Project</footer>
<script src="script.js"></script>
</body>
</html>
