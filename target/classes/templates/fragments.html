<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Reusable pieces: <head>, navbar, footer, story card. Included in every page. -->
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | StoryHub'">StoryHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:fragment="nav" class="nav">
  <div class="container">
    <a class="brand" th:href="@{/}">Story<span>Hub</span></a>
    <form class="search" th:action="@{/search}" method="get" autocomplete="off">
      <input id="searchBox" type="text" name="q" placeholder="Search by title or author" aria-label="Search stories">
      <div id="suggest" class="suggest"></div>
    </form>
    <nav class="links">
      <a th:href="@{/stories/new}">Write</a>
      <th:block th:if="${currentUser != null}">
        <a th:href="@{/favorites}">Bookmarks</a>
        <a th:href="@{/profile}" th:text="${currentUser.username}">me</a>
        <a th:href="@{/logout}">Log out</a>
      </th:block>
      <th:block th:if="${currentUser == null}">
        <a th:href="@{/login}">Log in</a>
        <a class="btn" th:href="@{/register}">Sign up</a>
      </th:block>
    </nav>
  </div>
</header>

<article th:fragment="card(s)" class="card">
  <span class="tag" th:text="${s.category}">Genre</span>
  <h3><a th:href="@{/stories/{id}(id=${s.id})}" th:text="${s.title}">Title</a></h3>
  <p class="excerpt" th:text="${s.excerpt}">Excerpt</p>
  <div class="meta">By <span th:text="${s.author.username}">author</span> · <span th:text="${s.readingMinutes}">1</span> min read</div>
</article>

<footer th:fragment="footer" class="footer">
  <div class="container">StoryHub: a place to write, read and keep stories.</div>
  <script th:src="@{/js/app.js}"></script>
</footer>
</html>
